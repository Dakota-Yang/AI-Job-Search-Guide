document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 0 0 1-2-2z\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-alert\" viewBox=\"0 0 24 24\"><path d=\"M12 3 2 20h20z\"><\u002Fpath><path d=\"M12 10v4M12 17h.01\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-check\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"m8 12 3 3 5-6\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-clock\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-search\" viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4-4\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-info\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 11v5M12 8h.01\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-moon\" viewBox=\"0 0 24 24\"><path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-down\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14M6 13l6 6 6-6\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-hand\" viewBox=\"0 0 24 24\"><path d=\"M12 3v9M12 12l-4 4M12 12l4 4M5 21h14\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-flag\" viewBox=\"0 0 24 24\"><path d=\"M5 21V4M5 4h11l-2 4 2 4H5\"><\u002Fpath><\u002Fsymbol>\n<\u002Fsvg>\n\n<header class=\"topbar\">\n  <div class=\"wrap\">\n    <a class=\"brand\" href=\"#top\">Make AI Work In Your Sleep<\u002Fa>\n    <nav class=\"nav\" aria-label=\"Sections\">\n      <a href=\"#setup\" style=\"--c:var(--orange)\" data-for=\"setup\"><i><\u002Fi>Setup<\u002Fa>\n      <a href=\"#part1\" style=\"--c:var(--blue)\" data-for=\"part1\"><i><\u002Fi>Part 1<\u002Fa>\n      <a href=\"#part2\" style=\"--c:var(--green)\" data-for=\"part2\"><i><\u002Fi>Part 2<\u002Fa>\n      <a href=\"#week\" style=\"--c:var(--green)\" data-for=\"week\"><i><\u002Fi>This week<\u002Fa>\n    <\u002Fnav>\n    <a class=\"theme\" href=\"https://www.linkedin.com/in/dakotayang\" target=\"_blank\" rel=\"noopener\" aria-label=\"Dakota Yang on LinkedIn\" title=\"Dakota Yang on LinkedIn\">in<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"prog\"><span><\u002Fspan><\u002Fdiv>\n<\u002Fheader>\n\n<main class=\"wrap\" id=\"top\">\n\n<section class=\"hero\">\n  <div class=\"kicker\">Build guide · Claude or ChatGPT<\u002Fdiv>\n  <h1>Make AI Work In Your Sleep<\u002Fh1>\n  <p class=\"lede\">AI Job Search &amp; Resume Tailoring, Runs In Google Drive<\u002Fp>\n  <div class=\"gets\">\n    <div class=\"get p1\"><span class=\"ic\"><svg class=\"ico\"><use href=\"#i-sun\"><\u002Fuse><\u002Fsvg><\u002Fspan>Job Search Runs at 9 AM<\u002Fdiv>\n    <div class=\"get p2\"><span class=\"ic\"><svg class=\"ico\"><use href=\"#i-doc\"><\u002Fuse><\u002Fsvg><\u002Fspan>Tailored Resume For Any JD<\u002Fdiv>\n    <div class=\"get setup\"><span class=\"ic\"><svg class=\"ico\"><use href=\"#i-folder\"><\u002Fuse><\u002Fsvg><\u002Fspan>Lives In Google Drive<\u002Fdiv>\n  <\u002Fdiv>\n  <a class=\"cta\" href=\"#setup\">Start with Step 0 <svg class=\"ico\"><use href=\"#i-down\"><\u002Fuse><\u002Fsvg><\u002Fa>\n<\u002Fsection>\n\n<div class=\"gate red\">\n  <div class=\"gt\"><svg class=\"ico\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span>READ EACH STEP CAREFULLY<\u002Fspan><\u002Fdiv>\n  <p>If you miss a step or instruction, it'll cost more time later to fix it<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"block\">\n  <div class=\"flow\">\n    <div><b>Instructions<\u002Fb>Who you are + your rules<\u002Fdiv>\n    <div><b>Knowledge<\u002Fb>What it looks up<\u002Fdiv>\n    <div><b>Skills<\u002Fb>Tasks done the same way<\u002Fdiv>\n    <div><b>Trigger<\u002Fb>Runs on a schedule<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"note\"><svg class=\"ico\"><use href=\"#i-hand\"><\u002Fuse><\u002Fsvg><span>You pick where to apply and hit submit. The AI never applies or emails for you.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n\n<div class=\"block\">\n  <h3>What you need<\u002Fh3>\n  <ul class=\"needs\">\n    <li><svg class=\"ico\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><span><b>Paid plan:<\u002Fb> Claude Pro+ (use <b>Sonnet<\u002Fb>) or ChatGPT Plus<\u002Fspan><\u002Fli>\n    <li><svg class=\"ico\"><use href=\"#i-folder\"><\u002Fuse><\u002Fsvg><span><b>Google account<\u002Fb> with your resume<\u002Fspan><\u002Fli>\n    <li><svg class=\"ico\"><use href=\"#i-doc\"><\u002Fuse><\u002Fsvg><span><b>2 real job descriptions<\u002Fb>, as text<\u002Fspan><\u002Fli>\n    <li><svg class=\"ico\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><span><b>~90 min:<\u002Fb> Part 1 (~50) today, Part 2 (~45) later<\u002Fspan><\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div class=\"gate red\" id=\"connect\">\n  <div class=\"gt\"><svg class=\"ico\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span>Connect Google to your AI first<\u002Fspan><\u002Fdiv>\n  <p>Not connected? The AI won't error. It <b>guesses<\u002Fb>, and guesses look real.<\u002Fp>\n  <ul>\n    <li><b>Claude:<\u002Fb> Settings → Connectors → add <b>Google Drive<\u002Fb>, <b>Google Docs<\u002Fb>, <b>Google Sheets<\u002Fb>, <b>Gmail<\u002Fb>. Then Settings → Capabilities → turn on <b>code execution and file creation<\u002Fb>.<\u002Fli>\n    <li><b>ChatGPT Plus:<\u002Fb> Settings → Apps → connect <b>Google Drive<\u002Fb> and <b>Gmail<\u002Fb>.<\u002Fli>\n    <li><b>Test<\u002Fb> in a new chat: <i>\"What are 3 recent files in my Google Drive, and what's the subject of my latest email?\"<\u002Fi> Wrong answer? Fix connectors first.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<!-- STEP 0 -->\n<section class=\"part setup pb\" id=\"setup\" data-part=\"\">\n  <div class=\"part-head\">\n    <div class=\"badge\"><svg class=\"ico\"><use href=\"#i-folder\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n    <div><div class=\"eyebrow\">SETUP<\u002Fdiv><h2>Step 0 · Set up your Google Drive<\u002Fh2><p class=\"sub\">~10 min · use these exact names<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"block\">\n    <h3>Must be in Drive first <span class=\"chip you\">YOU DO THIS<\u002Fspan><\u002Fh3>\n    <div class=\"files cl\">\n      <div class=\"file\"><div class=\"fh\"><label><input type=\"checkbox\" data-k=\"s0-folder\"><span>AI Job Search<\u002Fspan><\u002Flabel><span class=\"type\">Folder<\u002Fspan><\u002Fdiv>\n        <p>Drive → New → New folder. Everything goes inside.<\u002Fp><\u002Fdiv>\n      <div class=\"file\"><div class=\"fh\"><label><input type=\"checkbox\" data-k=\"s0-resume\"><span>Resume<\u002Fspan><\u002Flabel><span class=\"type\" style=\"color:oklch(0.78 0.16 245);border-color:oklch(0.78 0.16 245)\">Google Doc<\u002Fspan><\u002Fdiv>\n        <p><b>Must be a Google Doc, not PDF or Word.<\u002Fb> Have a PDF/.docx? Upload → right-click → Open with → Google Docs. Rename it <b>Resume<\u002Fb>. Delete the original.<\u002Fp><\u002Fdiv>\n      <div class=\"file\"><div class=\"fh\"><label><input type=\"checkbox\" data-k=\"s0-template\"><span>Resume Template<\u002Fspan><\u002Flabel><span class=\"type\" style=\"color:oklch(0.78 0.16 245);border-color:oklch(0.78 0.16 245)\">Google Doc<\u002Fspan><\u002Fdiv>\n        <p>The look for your tailored resumes. AI copies the <b>layout<\u002Fb>, not the words.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"block\">\n    <h3>Pick your Resume Template<\u002Fh3>\n    <div class=\"styles\">\n      <div class=\"file tpl\" style=\"border:2px solid #b31b1b\"><b class=\"n\">Harvard style<\u002Fb><p>Classic single column. Safe for most roles.<\u002Fp><a class=\"tpl-btn\" href=\"https://docs.google.com/document/d/11Ime4kk-Y2hAxWn9QMrkdOjJJmxlfperFZctaRx0nCA/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" style=\"--bc0:#e04848\">Open template ↗<\u002Fa><\u002Fdiv>\n      <div class=\"file tpl\" style=\"border:2px solid #9a6a3f\"><b class=\"n\">Brown style<\u002Fb><p>Denser. Fits more experience.<\u002Fp><a class=\"tpl-btn\" href=\"https://docs.google.com/document/d/1plo3RXw3IrWpQvaPPIAcT70JH2OnR1WNT6oc416SQvA/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" style=\"--bc0:#c08a56\">Open template ↗<\u002Fa><\u002Fdiv>\n      <div class=\"file\" style=\"border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,#ff4d4d,#ffa84d,#ffe14d,#4dd97a,#4db8ff,#8a6bff,#e05cff) border-box\"><b class=\"n\">Your own style<\u002Fb><p>Like your current look?<\u002Fp><p class=\"how\"><b>Resume<\u002Fb> → File → Make a copy → name it <b>Resume Template<\u002Fb> → save in <b>AI Job Search<\u002Fb>.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"margin-top:10px;padding:12px 14px\">\n      <p><b>Harvard or Brown:<\u002Fb> Open template → File → Make a copy → save it in <b>AI Job Search<\u002Fb> as <b>Resume Template<\u002Fb>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"block\">\n    <h3>Have ready, outside Drive<\u002Fh3>\n    <ul class=\"cl\">\n      <li><label><input type=\"checkbox\" data-k=\"s0-jd\"><span><b>Job description #1<\u002Fb> and <b>#2<\u002Fb> (full text)<\u002Fspan><\u002Flabel><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div class=\"block\">\n    <h3>Created for you by the prompts<\u002Fh3>\n    <ul class=\"made\">\n      <li><b>Job Tracker<\u002Fb><span class=\"by\">Prompt ①<\u002Fspan><span class=\"w\">Sheet. <b>Roles<\u002Fb> = jobs found or applied. <b>Run Log<\u002Fb> = search history.<\u002Fspan><\u002Fli>\n      <li><b>ME<\u002Fb><span class=\"by\">Prompt ②<\u002Fspan><span class=\"w\">You, your goals, dealbreakers, fit bar<\u002Fspan><\u002Fli>\n      <li><b>Bullet Bank<\u002Fb><span class=\"by\">Prompt ⑥<\u002Fspan><span class=\"w\">Every bullet you could use<\u002Fspan><\u002Fli>\n      <li><b>Resume - [Company] - [Role]<\u002Fb><span class=\"by\">Prompt ⑦<\u002Fspan><span class=\"w\">Each tailored resume<\u002Fspan><\u002Fli>\n      <li><b>Sizing Guide<\u002Fb><span class=\"by\">Prompt ⑧<\u002Fspan><span class=\"w\">Margins, fonts, spacing that fit one page<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div class=\"gate green\">\n    <div class=\"gt\"><svg class=\"ico\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><span>Step 0 done: folder has Resume + Resume Template (both Google Docs)<\u002Fspan><\u002Fdiv>\n    <p>Icons should be blue Docs, not red PDF or Word.<\u002Fp>\n  <\u002Fdiv>\n<div class=\"block pb\" id=\"legend\">\n  <h3><svg class=\"ico\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg>How to read this guide<\u002Fh3>\n  <div class=\"legend card\">\n    <code class=\"sample\">Grey box<\u002Fcode><div><b>Paste exactly, one at a time.<\u002Fb> Let the AI finish first.<\u002Fdiv>\n    <code class=\"sample\"><span class=\"fill\">[brackets]<\u002Fspan><\u002Fcode><div>Fill in your info.<\u002Fdiv>\n    <span class=\"chip new\">NEW CHAT<\u002Fspan><div><b>Start a fresh chat.<\u002Fb> Long chats waste usage and get sloppy. Your work is in Drive.<\u002Fdiv>\n    <span class=\"chip same\">SAME CHAT<\u002Fspan><div>Stay in this chat.<\u002Fdiv>\n    <span class=\"chip set\">SETTINGS<\u002Fspan><div>Paste into settings, not a chat.<\u002Fdiv>\n    <span class=\"chip you\">YOU DO THIS<\u002Fspan><div>Manual step, no prompt.<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"note\" style=\"margin-top:8px\"><svg class=\"ico\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span>Each prompt ends with a recap and your next step.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"part p1\" id=\"part1\" data-part=\"\">\n  <div class=\"part-head\">\n    <div class=\"badge\"><svg class=\"ico\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n    <div><div class=\"eyebrow\">PART 1<\u002Fdiv><h2>Your daily job search<\u002Fh2><p class=\"sub\">~50 min · tracker → ME → skill → run → schedule<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bar\"><span>Step 1 · Tracker<\u002Fspan><span class=\"time\"><svg class=\"ico\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg>~5 min<\u002Fspan><\u002Fdiv>\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">①<\u002Fspan><h3>Make your tracker<\u002Fh3><span class=\"chip new\">NEW CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt\"><div class=\"ph\"><span>Paste this<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Create a Google Sheet called \"Job Tracker\" in my \"AI Job Search\" Google Drive folder with two tabs.\nTab \"Roles\", columns: Company, Role, Status, Date Found, Date Posted, Link, Fit, Timeline, Location, Source, Notes.\nTab \"Run Log\", columns: Run Date, Search Window, Searches Run, New Roles Added, Notes. Leave it empty.\nThen search my Gmail from the last 2 months for application emails. Confirmations (\"thanks for applying,\" \"application received,\" \"thank you for your interest\") go in Roles with Status = Applied. Rejections go in with Status = Rejected. Use the email's date, Source = Gmail, one row per role. If you find nothing, say so and ask me to list any applications I remember.\nWhen you're done, give me 3-5 short bullets on what you created and how many rows you added, flag anything you weren't sure about, and end with \"Next:\" telling me to open a new chat and paste prompt ②.<\u002Fpre><\u002Fdiv>\n    <div class=\"check\">\n      <div class=\"ct\"><svg class=\"ico\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>Check the Sheet<\u002Fdiv>\n      <ul class=\"cl\">\n        <li><label><input type=\"checkbox\" data-k=\"c1-tabs\"><span>Two tabs?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"c1-rows\"><span>Real applications?<\u002Fspan><\u002Flabel><\u002Fli>\n      <\u002Ful>\n      <p class=\"after\">Fix wrong rows by hand.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <div class=\"bar\"><span>Step 2 · ME<\u002Fspan><span class=\"time\"><svg class=\"ico\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg>~15 min<\u002Fspan><\u002Fdiv>\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">②<\u002Fspan><h3>ME interview<\u002Fh3><span class=\"chip new\">NEW CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt long\"><div class=\"ph\"><span>Paste this<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Read my \"Resume\" Google Doc in my \"AI Job Search\" Drive folder. Then interview me to write my \"ME\" doc. Ask one question at a time and wait for my answer (15 questions max). If an answer is vague, ask one follow-up (for example, \"anything in tech\" → which 2-3 roles?).\nCover: my phone, email, LinkedIn URL, and city; grad date or years of experience; my top 2-3 target roles plus adjacent roles I'd take; level (internship, new grad, experienced) and when I can start; locations and on-site, hybrid, or remote; company size or stage; industries I want and ones I'd avoid; my pay floor; whether I'll need visa sponsorship; dealbreakers; 5-10 dream companies; my 2-3 strongest skills or stories; and how I want you to answer me (length, tone, how blunt).\nThen, from my resume and answers, propose my Honest fit bar: one sentence on what level of role my resume qualifies me for today. Be realistic, not flattering. Ask me to confirm or adjust it.\nWrite the doc in under 450 words with these headings: Contact, Background, Target roles, Timeline, Locations, Company preferences, Dealbreakers, Dream companies, Strengths, Honest fit bar, How I want answers. Save it as a Google Doc called \"ME\" in the same folder.\nWhen you're done, give me 3-5 short bullets on what you saved, and end with \"Next:\" telling me to paste prompt ③ into my custom instructions (not into a chat).<\u002Fpre><\u002Fdiv>\n    <div class=\"check\">\n      <div class=\"ct\"><svg class=\"ico\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>Check:<\u002Fdiv>\n      <ul class=\"cl\">\n        <li><label><input type=\"checkbox\" data-k=\"c2-fitbar\"><span>Read the Honest fit bar aloud. Too generous? Edit it.<\u002Fspan><\u002Flabel><\u002Fli>\n      <\u002Ful>\n      <p class=\"after\">All fit scores use it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">③<\u002Fspan><h3>Custom instructions<\u002Fh3><span class=\"chip set\">SETTINGS<\u002Fspan><\u002Fdiv>\n    <p class=\"where\">Claude: Settings → personal preferences · ChatGPT: Settings → Personalization → custom instructions<\u002Fp>\n    <div class=\"prompt\"><div class=\"ph\"><span>Paste in settings<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>When I ask about jobs, applications, or my resume, first read my \"ME\" doc, \"Job Tracker\" sheet, and \"Bullet Bank\" doc (once it exists) in my \"AI Job Search\" Google Drive folder, and follow ME's rules. After any multi-step task, end with a short bullet recap of what you did and what I should do next.<\u002Fpre><\u002Fdiv>\n  <\u002Farticle>\n\n  <div class=\"bar pb\"><span>Step 3 · Build the job search<\u002Fspan><span class=\"time\"><svg class=\"ico\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg>~5 min to build · ~10 min first run<\u002Fspan><\u002Fdiv>\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">④<\u002Fspan><h3>Build the daily-job-search skill<\u002Fh3><span class=\"chip new\">NEW CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt long\"><div class=\"ph\"><span>Paste this<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Create a skill called daily-job-search that runs when I say \"run my job search.\" Write it so it works in a brand-new chat with no memory of this one. The skill must:\n1. Read my \"ME\" doc and both tabs of my \"Job Tracker\" sheet in my \"AI Job Search\" Google Drive folder.\n2. Set the search window. If the Run Log tab is empty, this is my first run: find roles posted in the past 14 days. Otherwise, find roles posted since the most recent Run Date (usually the past 1-2 days, never more than 14), so searches never overlap or leave gaps.\n3. Run up to 15 web searches for my target roles, level, locations, and timeline. Include site:boards.greenhouse.io, site:jobs.lever.co, and site:jobs.ashbyhq.com, my dream companies' career pages, and GitHub job lists (like SimplifyJobs'). Never scrape LinkedIn or Handshake.\n4. Open each posting to confirm it's live and find its posted date. If it won't open, try the Greenhouse, Lever, or Ashby job API; still nothing? Mark it Unverified. Keep only roles posted inside the window. No date shown? Keep it only if it isn't already in my tracker, and write \"date unknown.\"\n5. Skip anything already in my Roles tab (same company and role, or same link), closed, or hitting a dealbreaker.\n6. Score fit 1-10 against my Honest fit bar with one line why. A 4 is a 4. Don't pad the list; two strong roles beat ten weak ones.\n7. Add each new role to Roles with Status \"Not applied,\" Date Found = today, Date Posted, and Source. Add one Run Log row: today's date, the window, searches run, new roles added.\n8. Deliver an HTML briefing, self-contained with inline CSS (Claude: as an artifact; ChatGPT: in canvas or as a downloadable .html file). Style: off-white page, one centered 800px column, clean sans-serif font. Header: \"Job Search Briefing,\" the date, and a one-line summary, over a thick dark rule. Small uppercase grey section labels. Each role is a white card with rounded corners, a thin border, and a colored left edge with a matching fit badge (green 7-10, amber 5-6, red 1-4), then a large green \"View posting →\" button. Sections, in order: Summary (window searched, new roles found, top pick); New roles ranked by fit, grouped by timeline (each card: role, company, fit, location, date posted, source, one-line why); Check manually (a LinkedIn link for each target role and city, filtered to the same window by adding &amp;f_TPR=r[window in seconds], plus a reminder to check Handshake); What didn't work (sites that wouldn't open); and a footer with the window, searches run, and tracker row count. Nothing new? Say so in a short briefing in the same style.\nPut the full HTML and CSS template inside the skill so every briefing looks the same. Never apply to jobs or email anyone.\nThen give me the skill to install (Claude: a skill file; ChatGPT without Skills: text for a Project's instructions). When you're done, give me 3-5 short bullets on what the skill does, then \"Next:\" with the exact install steps for my tool, and tell me to open a new chat and type \"run my job search.\"<\u002Fpre><\u002Fdiv>\n    <p class=\"where\" style=\"margin-top:10px;color:var(--ink)\"><b>Install:<\u002Fb> Claude: Customize → Skills → upload. ChatGPT: Skills (beta), or paste into a Project's instructions and search inside it.<\u002Fp>\n  <\u002Farticle>\n\n  <article class=\"step\">\n    <div class=\"sh\"><h3>First run<\u002Fh3><span class=\"chip new\">NEW CHAT<\u002Fspan><span class=\"chip you\">YOU DO THIS<\u002Fspan><\u002Fdiv>\n    <p>Type: <b>run my job search<\u002Fb>. First run covers <b>14 days<\u002Fb> and takes a few minutes. Later runs cover only new days.<\u002Fp>\n    <div class=\"check\">\n      <div class=\"ct\"><svg class=\"ico\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>Check the briefing:<\u002Fdiv>\n      <ul class=\"cl\">\n        <li><label><input type=\"checkbox\" data-k=\"cr-14\"><span>Searched past 14 days?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"cr-date\"><span>Every card has a date?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"cr-dupe\"><span>No jobs you already applied to?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"cr-live\"><span>\"View posting\" opens live jobs?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"cr-fit\"><span>Fit scores honest?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"cr-log\"><span>Run Log row added?<\u002Fspan><\u002Flabel><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <article class=\"step\">\n    <div class=\"sh\"><h3>Fix what's off<\u002Fh3><span class=\"chip same\">SAME CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt\"><div class=\"ph\"><span>Paste this<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Update daily-job-search to always <span class=\"fill\">[your fix, e.g. \"skip roles that need 3+ years of experience\"]<\u002Fspan>. Give me the new version, then 3 bullets on what changed and \"Next:\" with how to reinstall it.<\u002Fpre><\u002Fdiv>\n  <\u002Farticle>\n\n  <div class=\"bar pb\"><span>Step 4 · Put it on a schedule<\u002Fspan><span class=\"time\"><svg class=\"ico\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg>~3 min<\u002Fspan><\u002Fdiv>\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">⑤<\u002Fspan><h3>Schedule the daily run<\u002Fh3><span class=\"chip set\">SETTINGS<\u002Fspan><\u002Fdiv>\n    <p class=\"where\">Claude: <b>Scheduled tasks<\u002Fb> → new task · ChatGPT: <b>Tasks<\u002Fb>. Pick a time before you wake. Paste:<\u002Fp>\n    <div class=\"prompt\"><div class=\"ph\"><span>Paste as task prompt<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Run my job search using my daily-job-search skill. Use the window from my Run Log (since the last run) so nothing overlaps. Don't apply to anything or email anyone. Deliver the HTML briefing, then 3 bullets: how many new roles, the top pick and why, and anything that broke.<\u002Fpre><\u002Fdiv>\n  <\u002Farticle>\n  <div class=\"gate blue\">\n    <div class=\"gt\"><svg class=\"ico\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span>Scheduled run can't reach Drive or your skill?<\u002Fspan><\u002Fdiv>\n    <p>Run it by hand: new chat → <b>run my job search<\u002Fb>. The Run Log prevents repeats.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"part p2\" id=\"part2\" data-part=\"\">\n  <div class=\"part-head\">\n    <div class=\"badge\"><svg class=\"ico\"><use href=\"#i-doc\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n    <div><div class=\"eyebrow\">PART 2<\u002Fdiv><h2>Your resume tailor<\u002Fh2><p class=\"sub\">~45 min · bullets → tailor → sizing → skill → test<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bar\"><span>Step 5 · Bullet bank<\u002Fspan><span class=\"time\"><svg class=\"ico\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg>~15 min<\u002Fspan><\u002Fdiv>\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">⑥<\u002Fspan><h3>Build your bullet bank<\u002Fh3><span class=\"chip new\">NEW CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt long\"><div class=\"ph\"><span>Paste this<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Read my \"Resume\" Google Doc and my \"ME\" doc in my \"AI Job Search\" Drive folder. Build a bullet bank: every bullet on my resume, plus new ones.\nFirst, interview me one question at a time (10 questions max) about work that isn't on my resume yet, and about bullets missing a number: projects, clubs, part-time jobs, volunteering, results, tools I used, team size, how often, for whom.\nThen write 3-5 bullets for every job, club, and project, grouped under each one's title, organization, dates, and city (ask for any that are missing). Add my school, degree, and grad date, and a Skills list. Write every bullet in Google XYZ form with the number in the first few words: \"Grew X by [number] by doing Z.\" Never invent a number; write [#?] where one is missing.\nSave it as a Google Doc called \"Bullet Bank\" in \"AI Job Search.\"\nWhen you're done, give me 3-5 short bullets: how many bullets each role got, which roles are thin, and how many [#?] gaps there are. End with \"Next:\" telling me to fill any [#?] I can in the Doc, then open a new chat and paste prompt ⑦ with job description #1.<\u002Fpre><\u002Fdiv>\n    <p class=\"note\" style=\"margin-top:10px\"><svg class=\"ico\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span>More bullets than fit is the point. The tailor picks.<\u002Fspan><\u002Fp>\n  <\u002Farticle>\n\n  <div class=\"bar pb\"><span>Step 6 · Tailor, capture, test<\u002Fspan><span class=\"time\"><svg class=\"ico\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg>~30 min<\u002Fspan><\u002Fdiv>\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">⑦<\u002Fspan><h3>Tailor once, by hand<\u002Fh3><span class=\"chip new\">NEW CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt long\"><div class=\"ph\"><span>Paste this + job #1<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Tailor my resume to the job below. From my Bullet Bank, give every role 2-4 bullets, strongest first; a true, less on-target bullet beats a role with only one. Under 2 true bullets for a role? Keep what's real and tell me which. Rewrite each in the posting's language: one line, XYZ form, number or result in the first 8 words (no real number, or a [#?]? Lead with scope: how many, how often, for whom). Never invent a number, title, tool, or date; keep titles and dates exactly as in my bank; never repeat a result.\nThen make a Google Doc \"Resume - [Company] - [Role]\" in my \"AI Job Search\" folder, matching my \"Resume Template\" Doc's layout and formatting. Top: my name, then phone | email | LinkedIn | city from ME. Headings: EDUCATION, WORK EXPERIENCE (jobs), LEADERSHIP &amp; PROJECTS (clubs, projects), SKILLS (2-3 one-line rows, no Interests). Cut lines I lack info for.\nThen fit it to exactly one page: nothing wraps to a second line, no gap at the bottom. Too long? Cut the weakest bullet (keep 2+ per role), then words, then margins (min 0.5\") or font (min 10pt). Too short? Add true bullets from my bank; out of good ones, raise font and spacing a step at a time until it's full (max 12pt).\nWhen you're done, give me 3-5 short bullets on what you changed, a one-line tagline in the posting's language, and 3 keywords from the posting I'm missing. End with \"Next:\" telling me to open the Doc, check it, and tell you what to fix in this same chat.\n<span class=\"fill\">[paste job description #1]<\u002Fspan><\u002Fpre><\u002Fdiv>\n    <div class=\"check\">\n      <div class=\"ct\"><svg class=\"ico\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>Correct it at least once <span class=\"chip same\">SAME CHAT<\u002Fspan><\u002Fdiv>\n      <ul class=\"cl\">\n        <li><label><input type=\"checkbox\" data-k=\"c7-contact\"><span>Contact line right?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"c7-bullets\"><span>2+ bullets per role?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"c7-heads\"><span>Right headings?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"c7-page\"><span>One page, no wrapped lines or gap?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"c7-tpl\"><span>Matches template?<\u002Fspan><\u002Flabel><\u002Fli>\n      <\u002Ful>\n      <p class=\"after\">Say what's wrong in plain words. Fixes go into the skill in ⑨.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">⑧<\u002Fspan><h3>Lock the sizing<\u002Fh3><span class=\"chip same\">SAME CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt\"><div class=\"ph\"><span>Paste this<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>It fits. Save a Google Doc called \"Sizing Guide\" in my \"AI Job Search\" folder: margins, font and size for each part (name, headings, role lines, bullets), spacing, and the longest bullet that fit on one line. Add one step smaller and one step larger (text ±0.5pt, spacing ±2pt). Future resumes add good bullets first, then use the step that fills the page. When you're done, give me 2-3 bullets on what you saved and \"Next:\" telling me to paste prompt ⑨ in this same chat.<\u002Fpre><\u002Fdiv>\n  <\u002Farticle>\n\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">⑨<\u002Fspan><h3>Save it as a skill<\u002Fh3><span class=\"chip same\">SAME CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt\"><div class=\"ph\"><span>Paste this<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Turn this into a skill called tailor-resume, with every correction I made in this chat. It reads my \"Sizing Guide,\" \"Bullet Bank,\" \"ME,\" and \"Resume Template\" first. It runs when I paste a job and ask to tailor my resume. Give me the skill to install (Claude: a skill file; ChatGPT without Skills: text for a Project's instructions). When you're done, give me 3-5 bullets on what the skill does and \"Next:\" with the exact install steps, then tell me to test it in a new chat with a different job description.<\u002Fpre><\u002Fdiv>\n  <\u002Farticle>\n\n  <article class=\"step\">\n    <div class=\"sh\"><h3>Test<\u002Fh3><span class=\"chip new\">NEW CHAT<\u002Fspan><span class=\"chip you\">YOU DO THIS<\u002Fspan><\u002Fdiv>\n    <p>Paste job description #2, then type: <b>tailor my resume for this<\u002Fb><\u002Fp>\n    <div class=\"check\">\n      <div class=\"ct\"><svg class=\"ico\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>Check:<\u002Fdiv>\n      <ul class=\"cl\">\n        <li><label><input type=\"checkbox\" data-k=\"ct-fire\"><span>Skill fired?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"ct-invent\"><span>Nothing invented?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"ct-nums\"><span>Numbers early?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"ct-contact\"><span>Contact line right?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"ct-bullets\"><span>2+ bullets per role?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"ct-heads\"><span>Right headings?<\u002Fspan><\u002Flabel><\u002Fli>\n        <li><label><input type=\"checkbox\" data-k=\"ct-page\"><span>One page, no gap?<\u002Fspan><\u002Flabel><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <article class=\"step\">\n    <div class=\"sh\"><span class=\"num\">⑩<\u002Fspan><h3>Fix<\u002Fh3><span class=\"chip same\">SAME CHAT<\u002Fspan><\u002Fdiv>\n    <div class=\"prompt\"><div class=\"ph\"><span>Paste this<\u002Fspan><button class=\"copy\" type=\"button\">Copy<\u002Fbutton><\u002Fdiv><pre>Update tailor-resume to always <span class=\"fill\">[your fix]<\u002Fspan>. Give me the new version, then 3 bullets on what changed and \"Next:\" with how to reinstall it.<\u002Fpre><\u002Fdiv>\n  <\u002Farticle>\n\n  <div class=\"wk\" id=\"week\" data-part=\"\" style=\"scroll-margin-top:60px\">\n  <div class=\"gate green\" style=\"margin-top:8px\">\n    <div class=\"gt\"><svg class=\"ico\"><use href=\"#i-flag\"><\u002Fuse><\u002Fsvg><span>This week<\u002Fspan><\u002Fdiv>\n    <ul class=\"cl week\">\n      <li><label><input type=\"checkbox\" data-k=\"w-read\"><span>Read your briefing 3 mornings. Fix the skill when something's off (same \"Update … to always\" prompt).<\u002Fspan><\u002Flabel><\u002Fli>\n      <li><label><input type=\"checkbox\" data-k=\"w-fit\"><span>Tighten your fit bar if scores feel generous.<\u002Fspan><\u002Flabel><\u002Fli>\n      <li><label><input type=\"checkbox\" data-k=\"w-skill3\"><span>Build skill #3: by hand → correct → save as skill → test → fix. Try: cover letter, follow-up email, interview prep.<\u002Fspan><\u002Flabel><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n<footer class=\"wrap\">Your checkmarks are saved in this browser only.<\u002Ffooter>\n\n<script>\n(function(){\n  var KEY='aiosGuide.checks.v1',st={};\n  try{st=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){st={};}\n  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}\n  Array.prototype.forEach.call(document.querySelectorAll('input[type=checkbox][data-k]'),function(cb){\n    cb.checked=!!st[cb.getAttribute('data-k')];\n    cb.addEventListener('change',function(){st[cb.getAttribute('data-k')]=cb.checked;save();});\n  });\n\n  function fallbackCopy(t){\n    var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');\n    ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();\n    var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);return ok;\n  }\n  function copyText(t){\n    if(navigator.clipboard&&window.isSecureContext){\n      return navigator.clipboard.writeText(t).then(function(){return true;},function(){return fallbackCopy(t);});\n    }\n    return Promise.resolve(fallbackCopy(t));\n  }\n  Array.prototype.forEach.call(document.querySelectorAll('.prompt'),function(p){\n    var b=p.querySelector('.copy'),pre=p.querySelector('pre'),timer;\n    b.setAttribute('aria-live','polite');\n    b.addEventListener('click',function(){\n      copyText(pre.textContent).then(function(ok){\n        clearTimeout(timer);\n        b.textContent=ok?'Copied ✓':'Select & copy';\n        if(ok)b.classList.add('ok');\n        timer=setTimeout(function(){b.textContent='Copy';b.classList.remove('ok');},2000);\n      });\n    });\n  });\n\n  var links={},bar=document.querySelector('.prog span');\n  Array.prototype.forEach.call(document.querySelectorAll('.nav a'),function(a){links[a.getAttribute('data-for')]=a;});\n  var parts=Array.prototype.slice.call(document.querySelectorAll('[data-part]'));\n  function onScroll(){\n    var y=window.scrollY,h=document.documentElement.scrollHeight-innerHeight;\n    bar.style.width=(h>0?Math.min(100,y/h*100):0)+'%';\n    var cur=null;\n    parts.forEach(function(s){if(s.getBoundingClientRect().top<innerHeight*0.4)cur=s.id;});\n    if(y+innerHeight>=document.documentElement.scrollHeight-4)cur='week';\n    for(var k in links){links[k].setAttribute('aria-current',k===cur?'true':'false');}\n    bar.style.setProperty('--c',cur&&links[cur]?getComputedStyle(links[cur]).getPropertyValue('--c'):'var(--orange)');\n  }\n  addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);onScroll();\n\n  var reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;\n  function all(s){return Array.prototype.slice.call(document.querySelectorAll(s));}\n  all('.gets,.flow,.needs,.files,.styles,.made').forEach(function(el){el.classList.add('stg');});\n  all('.hero>*:not(.gets),.block>h3,.block>.legend,.block>.card,.block>.note,.block>.flow+.note,.gate,.bar,.step,.check').forEach(function(el){if(!el.closest('.stg'))el.classList.add('rv');});\n  var revealEls=all('.rv,.stg');\n  function showAll(){revealEls.forEach(function(el){el.classList.add('in');});}\n  if(!('IntersectionObserver' in window)||reduceMotion){showAll();}\n  else{\n    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:0.15,rootMargin:'0px 0px -8% 0px'});\n    revealEls.forEach(function(el){io.observe(el);});\n    var pending=false;\n    function sweep(){var vh=innerHeight;revealEls.forEach(function(el){if(el.classList.contains('in'))return;if(el.getBoundingClientRect().top<vh*1.15){el.classList.add('in');io.unobserve(el);}});pending=false;}\n    addEventListener('scroll',function(){if(!pending){pending=true;requestAnimationFrame(sweep);}},{passive:true});\n    addEventListener('resize',sweep);sweep();\n  }\n  addEventListener('beforeprint',showAll);\n\n  var pixelEls=all('.hero h1,.part-head h2');\n  if(pixelEls.length&&!reduceMotion&&'IntersectionObserver' in window){\n    pixelEls.forEach(function(el){\n      var text=el.textContent;el.classList.add('pixel-text');el.setAttribute('aria-label',text);el.textContent='';\n      var frag=document.createDocumentFragment(),words=text.split(' ');\n      words.forEach(function(word,wi){\n        var ws=document.createElement('span');ws.style.display='inline-block';ws.setAttribute('aria-hidden','true');\n        for(var i=0;i<word.length;i++){var s=document.createElement('span');s.className='pc';s.textContent=word[i];s.style.transitionDelay=(Math.random()*260).toFixed(0)+'ms';ws.appendChild(s);}\n        frag.appendChild(ws);if(wi<words.length-1)frag.appendChild(document.createTextNode(' '));\n      });\n      el.appendChild(frag);\n    });\n    var pio=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('in',e.isIntersecting);});},{threshold:0.15,rootMargin:'0px 0px -6% 0px'});\n    pixelEls.forEach(function(el){pio.observe(el);});\n    addEventListener('beforeprint',function(){pixelEls.forEach(function(el){el.classList.add('in');});});\n  }\n\n  /* section hand-off: leaving section lifts and dims; incoming content holds, then releases */\n  (function(){\n    if(reduceMotion)return;\n    var secs=all('main > section');if(!secs.length)return;\n    var wraps=secs.map(function(s,i){if(i===0)return null;var w=document.createElement('div');w.className='pin';while(s.firstChild)w.appendChild(s.firstChild);s.appendChild(w);return w;});\n    secs.forEach(function(s){s.style.willChange='transform, opacity';s.style.transformOrigin='50% 100%';});\n    var queued=false;\n    function ease(t,k){var ss=t*t*(3-2*t);return t+(ss-t)*k;}\n    function paint(){\n      queued=false;var vh=innerHeight||1,enterWin=vh*0.75;\n      for(var i=0;i<secs.length;i++){\n        var sec=secs[i],wrap=wraps[i],r=sec.getBoundingClientRect();\n        if(r.bottom<-vh*0.5||r.top>vh*1.6){if(sec.style.transform){sec.style.transform='';sec.style.opacity='';}if(wrap&&wrap.style.transform){wrap.style.transform='';wrap.style.opacity='';}continue;}\n        var exitWin=Math.min(vh,r.height),maxS=document.documentElement.scrollHeight-vh,topAtEnd=r.top-(maxS-scrollY),exitP=(exitWin*0.70-r.bottom)/(exitWin*0.48);\n        exitP=exitP<0?0:(exitP>1?1:exitP);if(i===secs.length-1)exitP=0;\n        if(exitP>0){var e=ease(exitP,0.7);sec.style.transform='translate3d(0,'+(-16*e).toFixed(1)+'px,0)';sec.style.opacity=(1-0.35*e).toFixed(3);}\n        else if(sec.style.transform){sec.style.transform='';sec.style.opacity='';}\n        if(wrap){\n          var win=Math.max(1,Math.min(enterWin,vh-topAtEnd));var enterP=(vh-r.top)/win;enterP=enterP<0?0:(enterP>1?1:enterP);\n          if(enterP<1){var ep=ease(enterP,0.45),inv=1-ep;wrap.style.transform='translate3d(0,'+(inv*20).toFixed(1)+'px,0)';wrap.style.opacity=ep.toFixed(3);}\n          else if(wrap.style.transform){wrap.style.transform='';wrap.style.opacity='';}\n        }\n      }\n    }\n    function os(){if(!queued){queued=true;requestAnimationFrame(paint);}}\n    addEventListener('scroll',os,{passive:true});addEventListener('resize',os);paint();\n  })();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
